[project]
name = "qq-deepseek-bot"
version = "0.1.0"
description = "A QQ group bot powered by DeepSeek."
requires-python = ">=3.9"
dependencies = [
  "nonebot2[fastapi]>=2.4.0,<3.0.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "openai>=1.0.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "silk-python==0.2.8",
  "edge-tts==7.2.8",
  "miniaudio==1.71",
]

[tool.nonebot]
plugins = ["src.plugins.ai_chat"]
plugin_dirs = []
builtin_plugins = []
adapters = [
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
